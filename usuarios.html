function esc2(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
function showToast(msg) {
const box = document.getElementById('toastBox');
box.innerHTML = '<div class="toast">'+msg+'</div>';

function traducirErrorAuth(code) {
const map = {
'auth/user-not-found': 'No existe una cuenta con ese correo. Pídele al administrador que la cree.',
'auth/wrong-password': 'Contraseña incorrecta.',
'auth/invalid-email': 'El correo no es válido.',
'auth/too-many-requests': 'Demasiados intentos. Espera unos minutos.',
'auth/email-already-in-use': 'Ya existe una cuenta con ese correo.',
'auth/weak-password': 'La contraseña es demasiado corta (mínimo 6 caracteres).'
};
return map[code] || code;
}
function conTimeout(promesa, ms) {
return Promise.race([promesa, new Promise((_, rechazar) => setTimeout(() => rechazar({ code: 'tiempo-agotado', message: 'La base de datos tardó demasiado en responder' }), ms))]);
}
async function leerNodoRest(path, ms) {
const tok = await conTimeout(auth.currentUser.getIdToken(), ms);
const ctrl = new AbortController();
const t = setTimeout(() => ctrl.abort(), ms);
try {
const r = await fetch(firebase.app().options.databaseURL + '/' + path + '.json?auth=' + encodeURIComponent(tok), { signal: ctrl.signal });
if (!r.ok) throw { code: 'http-' + r.status, message: 'HTTP ' + r.status };
return await r.json();
} catch (e) {
if (e && e.name === 'AbortError') throw { code: 'tiempo-agotado', message: 'La consulta HTTP tardó demasiado' };
throw e;
} finally { clearTimeout(t); }
}
function getSecondaryAuth() {
if (!secondaryApp) {
secondaryApp = firebase.initializeApp(state.fbConfig, 'CuentaSecundaria' + Date.now());
}
return secondaryApp.auth();
}
function randomTempPassword() {
const chars = 'ABCDEFGHJKMNPQRSTUVWXYZabcdefghjkmnpqrstuvwxyz23456789';
let out = '';
for (let i = 0; i < 8; i++) out += chars[Math.floor(Math.random() * chars.length)];
return out;
}

async function correrDiagnosticoUsuarios() {
if (state.diagCorriendo) return;
state.diagCorriendo = true;
const lineas = [];
const pintar = () => { state.diagTexto = lineas.join('\n'); render(); };
lineas.push('Cuenta: ' + ((state.user && state.user.email) || '(sin sesión)'));
lineas.push('UID: ' + currentUid);
lineas.push('Admin en la app: ' + (state.isAdmin ? 'sí' : 'no'));
pintar();
const t0 = Date.now();
async function paso(nombre, fn) {
const ini = Date.now();
try {
const r = await conTimeout(fn(), 8000);
lineas.push('✅ ' + nombre + ': ' + r + ' (' + (Date.now() - ini) + ' ms)');
} catch (e) {
lineas.push('❌ ' + nombre + ': ' + ((e && e.code) || '') + ' ' + ((e && e.message) || e));
}
pintar();
}
await paso('HTTP directo: cuentas (solo nombres)', async () => { const v = (await leerRest('perfiles', 'shallow=true', 15000)) || {}; return Object.keys(v).length + ' cuentas'; });
await paso('HTTP directo: tu perfil', async () => { const v = await leerRest('perfiles/' + currentUid, '', 15000); return v ? 'existe' : 'no existe (cuenta original)'; });
await paso('Conexión a Firebase', async () => (await db.ref('.info/connected').once('value')).val() ? 'conectado' : 'sin conexión todavía');
await paso('Registro admins/<tu uid>', async () => String((await db.ref('admins/' + currentUid).once('value')).val()));
await paso('Tu perfil', async () => { const v = (await db.ref('perfiles/' + currentUid).once('value')).val(); return v ? 'existe' : 'no existe (cuenta original)'; });
await paso('Lista de perfiles', async () => { const v = (await db.ref('perfiles').once('value')).val() || {}; return Object.keys(v).length + ' perfiles'; });
lineas.push('Versión: 15-oct-2026 periodos');
state.diagCorriendo = false;
pintar();
}
async function leerRest(path, query, ms) {
const tok = await conTimeout(auth.currentUser.getIdToken(), ms);
const ctrl = new AbortController();
const t = setTimeout(() => ctrl.abort(), ms);
try {
const r = await fetch(firebase.app().options.databaseURL + '/' + path + '.json?' + (query ? query + '&' : '') + 'auth=' + encodeURIComponent(tok), { signal: ctrl.signal });
if (!r.ok) { let d = ''; try { d = (await r.json()).error || ''; } catch (e) {} throw { code: 'http-' + r.status, message: d || ('HTTP ' + r.status) }; }
return await r.json();
} catch (e) {
if (e && e.name === 'AbortError') throw { code: 'tiempo-agotado', message: 'La consulta tardó más de ' + Math.round(ms/1000) + ' s' };
throw e;
} finally { clearTimeout(t); }
}
async function cargarPerfilesProgresivo() {
state.adminUsersProgress = 'Consultando la lista de cuentas...'; render();
const claves = Object.keys((await leerRest('perfiles', 'shallow=true', 20000)) || {});
const lista = [];
state.adminUsersProgress = 'Cuentas encontradas: ' + claves.length + '. Cargando 0 de ' + claves.length + '...'; render();
let i = 0, hechos = 0;
async function trabajador() {
while (i < claves.length) {
const uid = claves[i++];
try { const v = await leerRest('perfiles/' + uid, '', 20000); if (v) lista.push({ uid, ...v }); } catch (e) { /* una cuenta que falle no detiene a las demás */ }
hechos++;
if (hechos % 5 === 0 || hechos === claves.length) { state.adminUsersProgress = 'Cargando ' + hechos + ' de ' + claves.length + '...'; render(); }
}
}
await Promise.all([trabajador(), trabajador(), trabajador(), trabajador(), trabajador(), trabajador()]);
return lista;
}
async function cargarListaUsuarios() {
state.adminUsersLoading = true;
state.adminUsersProgress = '';
state.adminUsersError = '';
render();
try {
if (state.userAdminScope === 'own') {
// Un usuario delegado nunca lee el nodo global "perfiles"; solo consulta su propio
// índice "gestores/<su-uid>/misUsuarios" y luego lee, uno por uno, únicamente los
// perfiles que él mismo creó (cada uno con permiso propio a nivel de reglas).
const idxSnap = await conTimeout(db.ref('gestores/' + currentUid + '/misUsuarios').once('value'), 15000);
const uids = Object.keys(idxSnap.val() || {});
const perfiles = await conTimeout(Promise.all(uids.map(uid => db.ref('perfiles/' + uid).once('value'))), 15000);
state.adminUsersList = perfiles
.map((snap, i) => snap.val() ? { uid: uids[i], ...snap.val() } : null)
.filter(Boolean);
} else {
state.adminUsersList = await cargarPerfilesProgresivo();
}
} catch (e) {
state.adminUsersError = ((e && e.code) ? e.code + ' — ' : '') + ((e && e.message) || 'error desconocido');
showToast('❌ No se pudo cargar la lista de usuarios');
state.adminUsersList = null;
}
state.adminUsersLoading = false;
render();
}
async function crearUsuarioNuevo() {
const emailInput = document.getElementById('newUserEmail').value.trim();
const nombre = document.getElementById('newUserNombre').value.trim();
const telefono = document.getElementById('newUserPhone').value.trim();
const correoContacto = document.getElementById('newUserCorreoContacto').value.trim();
if (!emailInput) { showToast('❌ Escribe el usuario del nuevo correo'); return; }
// El correo de acceso puede ser el alias corto de la escuela (se completa
// solo con @chavarria.edu.com) O un correo real completo (por ejemplo, uno
// @jaliscoedu.mx o un Gmail personal) — en ese caso se usa tal cual, para que
// esa persona pueda recuperar su propia contraseña con el correo real de
// Firebase si la olvida.
const usuario = emailInput.includes('@') ? emailInput.split('@')[0] : emailInput;
const email = usuario.toLowerCase() + REQUIRED_EMAIL_DOMAIN;
const accesoPrimaria = !!document.getElementById('newUserAccesoPrimaria').checked;
const accesoSecundaria = !!document.getElementById('newUserAccesoSecundaria').checked;
const accesoCheckin = !!document.getElementById('newUserAccesoCheckin').checked;
const accesoBitacora = !!document.getElementById('newUserAccesoBitacora').checked;
const elGestionarUsuarios = document.getElementById('newUserPuedeGestionar');
// Solo el administrador global puede otorgar el permiso de gestionar usuarios;
// un usuario delegado nunca puede crear más sub-administradores.
const puedeGestionarUsuarios = state.isAdmin && elGestionarUsuarios ? !!elGestionarUsuarios.checked : false;
// El "espacio" (carpeta de datos) del nuevo usuario:
//  - Si lo crea el administrador global: el nuevo usuario tiene su propio espacio aislado (su propio uid).
//  - Si lo crea un usuario delegado: el nuevo usuario comparte el mismo espacio de datos que su creador,
//    sin tocar el espacio del administrador ni el de ningún otro usuario independiente.
const btn = document.getElementById('crearUsuarioBtn');
if (btn) { btn.disabled = true; btn.textContent = 'Creando...'; }
const tempPass = randomTempPassword();
try {
const secAuth = getSecondaryAuth();
const cred = await secAuth.createUserWithEmailAndPassword(email, tempPass);
const newUid = cred.user.uid;
const espacioUid = state.isAdmin ? newUid : ((state.perfilActual && state.perfilActual.espacioUid) || currentUid);
const nuevoPerfil = {
email, nombre: nombre || '', telefono: telefono || '',
correoContacto: correoContacto || '',
mustChangePassword: true,
tempPasswordActual: tempPass,
creadoPor: currentUid,
creadoEn: new Date().toISOString(),
espacioUid,
accesoPrimaria, accesoSecundaria, accesoCheckin, accesoBitacora,
puedeGestionarUsuarios,
deshabilitado: false,
eliminado: false
};
const escrituras = { ['perfiles/' + newUid]: nuevoPerfil };
if (!state.isAdmin) {
// Índice propio del usuario delegado: le permite después volver a listar
// exactamente a quién creó, sin necesitar leer el nodo "perfiles" completo.
escrituras['gestores/' + currentUid + '/misUsuarios/' + newUid] = true;
}
await db.ref().update(escrituras);
await secAuth.signOut();
showToast('✅ Usuario creado. Comparte su contraseña temporal por WhatsApp.');
document.getElementById('newUserEmail').value = '';
document.getElementById('newUserNombre').value = '';
document.getElementById('newUserPhone').value = '';
document.getElementById('newUserCorreoContacto').value = '';

document.getElementById('newUserAccesoSecundaria').checked = false;

if (elGestionarUsuarios) elGestionarUsuarios.checked = false;
cargarListaUsuarios();
} catch (e) {
showToast('❌ No se pudo crear: ' + traducirErrorAuth(e.code));
}

}
function actualizarPermisoUsuario(uid, campo, valor) {
db.ref('perfiles/' + uid).update({ [campo]: valor });
const u = state.adminUsersList && state.adminUsersList.find(x => x.uid === uid);
if (u) u[campo] = valor;
render();
}
function toggleCkRestriccionGeneral(uid, activar) {
const u = state.adminUsersList && state.adminUsersList.find(x => x.uid === uid);
if (activar) {
const nuevo = { primaria: { grados: [], grupos: [] }, secundaria: { grados: [], grupos: [] } };
db.ref('perfiles/' + uid + '/ckAsignacion').set(nuevo);
if (u) u.ckAsignacion = nuevo;
} else {
db.ref('perfiles/' + uid + '/ckAsignacion').remove();
if (u) delete u.ckAsignacion;
}
render();
}
function toggleCkAsignacionValor(uid, nivel, tipo, valor, checked) {
const u = state.adminUsersList && state.adminUsersList.find(x => x.uid === uid);
const actual = (u && u.ckAsignacion && u.ckAsignacion[nivel] && u.ckAsignacion[nivel][tipo]) || [];
const nuevo = checked ? (actual.includes(valor) ? actual : [...actual, valor]) : actual.filter(v => v !== valor);
db.ref('perfiles/' + uid + '/ckAsignacion/' + nivel + '/' + tipo).set(nuevo);
if (u) {
u.ckAsignacion = u.ckAsignacion || { primaria: { grados: [], grupos: [] }, secundaria: { grados: [], grupos: [] } };
u.ckAsignacion[nivel] = u.ckAsignacion[nivel] || { grados: [], grupos: [] };
u.ckAsignacion[nivel][tipo] = nuevo;
}
render();
}
function ckAsignacionBloqueHtml(u, nivel, etiqueta, grados, grupos) {
const asignRaw = (u.ckAsignacion && u.ckAsignacion[nivel]) || {};
const asign = { grados: Array.isArray(asignRaw.grados) ? asignRaw.grados : Object.values(asignRaw.grados || {}), grupos: Array.isArray(asignRaw.grupos) ? asignRaw.grupos : Object.values(asignRaw.grupos || {}) };
const chip = (tipo, valor, marcado) => `<label style="display:inline-flex;align-items:center;gap:4px;font-size:0.76em;margin:2px 6px 2px 0;"><input type="checkbox" ${marcado ? 'checked' : ''} onchange="toggleCkAsignacionValor('${u.uid}','${nivel}','${tipo}','${valor}',this.checked)"/>${valor}</label>`;
return `
<div style="margin-top:6px;padding:6px;background:#fff;border:1px solid #e5e7eb;border-radius:6px;">
<p style="font-size:0.74em;font-weight:700;color:#374151;margin-bottom:3px;">${etiqueta}</p>
<p style="font-size:0.7em;color:#6b7280;margin-bottom:2px;">Grados:</p>
<div>${grados.map(g => chip('grados', g, asign.grados.includes(g))).join('')}</div>
<p style="font-size:0.7em;color:#6b7280;margin:4px 0 2px;">Grupos:</p>
<div>${grupos.map(g => chip('grupos', g, asign.grupos.includes(g))).join('')}</div>
</div>`;
}
function toggleDeshabilitarUsuario(u) {
const nuevoValor = !u.deshabilitado;
const mensaje = nuevoValor
? `¿Deshabilitar a ${u.nombre || u.email}? No podrá iniciar sesión hasta que lo vuelvas a habilitar.`
: `¿Habilitar de nuevo a ${u.nombre || u.email}?`;
if (!confirm(mensaje)) return;
db.ref('perfiles/' + u.uid).update({ deshabilitado: nuevoValor });
u.deshabilitado = nuevoValor;
render();
showToast(nuevoValor ? '🚫 Usuario deshabilitado' : '✅ Usuario habilitado');
}
function pedirEliminarUsuario(uid) {
state.deleteConfirmUid = uid;
state.deleteConfirmPassword = '';
state.deleteConfirmError = '';
render();
}
function cancelarEliminarUsuario() {
state.deleteConfirmUid = null;
state.deleteConfirmPassword = '';
state.deleteConfirmError = '';
render();
}
async function confirmarEliminarUsuario(u) {
state.deleteConfirmError = '';
if (!state.deleteConfirmPassword) {
state.deleteConfirmError = 'Escribe tu contraseña para confirmar.';
render();
return;
}
state.deleteConfirmBusy = true;
render();
try {
// Se vuelve a pedir la contraseña de quien está eliminando (administrador o usuario
// delegado) para evitar que se borre a alguien por accidente.
const cred = firebase.auth.EmailAuthProvider.credential(state.user.email, state.deleteConfirmPassword);
await auth.currentUser.reauthenticateWithCredential(cred);
// No es posible borrar la cuenta de acceso (Firebase Auth) de otra persona desde
// el navegador; en su lugar la marcamos como eliminada para que ya no pueda
// volver a entrar, y la quitamos de la lista visible.
await db.ref('perfiles/' + u.uid).update({ eliminado: true, deshabilitado: true });
showToast('🗑️ Usuario eliminado');
state.deleteConfirmUid = null;
state.deleteConfirmPassword = '';
cargarListaUsuarios();
} catch (e) {
state.deleteConfirmError = e.code === 'auth/wrong-password' ? 'Contraseña incorrecta.' : 'No se pudo confirmar: ' + (e.code ? traducirErrorAuth(e.code) : e.message);
}
state.deleteConfirmBusy = false;
render();
}
function whatsappLinkParaUsuario(u) {
const nombre = u.nombre ? ' ' + u.nombre : '';
// Si ya cambió su contraseña, ya no existe ninguna clave temporal guardada que
// mandarle (por seguridad, se borra en cuanto la cambian) — antes esto mandaba
// literalmente la palabra "undefined" en el mensaje.
const mensaje = u.tempPasswordActual
? `Hola${nombre}, aquí están tus datos de acceso al Sistema Escolar:\nCorreo: ${u.email}\nContraseña: ${u.tempPasswordActual}\n(Al entrar, el sistema te pedirá cambiarla).`
: `Hola${nombre}, tu cuenta del Sistema Escolar ya está activa con el correo ${u.email}. Si olvidaste tu contraseña, avísame para generarte una nueva.`;
const texto = encodeURIComponent(mensaje);
const tel = String(u.telefono || '').replace(/[^0-9]/g, '');
return `https://wa.me/${tel}?text=${texto}`;
}
function copiarPassword(pass) {
navigator.clipboard.writeText(pass).then(() => showToast('📋 Contraseña copiada'));
}
function togglePasswordVisible(uid) {
if (state.passwordsVisibles[uid]) {
state.passwordsVisibles[uid] = false;
render();
return;
}
const pinIngresado = prompt('Ingresa tu PIN para ver esta contraseña:');
if (pinIngresado === null) return;
if (pinIngresado.trim() !== getPinGestionUsuarios()) {
alert('PIN incorrecto.');
return;
}
state.passwordsVisibles[uid] = true;
render();
}

function render() {
  const app = document.getElementById('app');
  if (!state.user) { app.innerHTML = '<div class="center-screen"><p>Cargando...</p></div>'; return; }
  try { app.innerHTML = renderTopbarSimple() + renderAdminUsuarios(); }
  catch (e) { app.innerHTML = renderTopbarSimple() + '<main><div class="card" style="border:1px solid #fecaca;background:#fef2f2;"><p style="font-weight:700;color:#b91c1c;">Error al mostrar la pantalla</p><p style="font-size:0.8em;word-break:break-word;">' + esc2(String(e && e.message)) + '</p></div></main>'; }
}
function closeUserAdmin() { window.location.href = 'index.html'; }
function handleLogout() { auth.signOut().then(() => { window.location.href = 'index.html'; }); }
function pedirPinYEntrar() {
  const pin = prompt('Ingresa tu PIN para entrar a Gestionar usuarios:');
  if (pin === null || pin.trim() !== getPinGestionUsuarios()) {
    if (pin !== null) alert('PIN incorrecto.');
    window.location.href = 'index.html';
    return false;
  }
  return true;
}
firebase.initializeApp(FIREBASE_CONFIG);
auth = firebase.auth();
db = firebase.database();
auth.onAuthStateChanged(async u => {
  if (!u) { window.location.href = 'index.html'; return; }
  currentUid = u.uid;
  state.user = u;
  const email = (u.email || '').toLowerCase();
  if (ADMIN_EMAILS.includes(email)) {
    state.isAdmin = true;
    state.userAdminScope = 'all';
    try { const es = await conTimeout(db.ref('adminEspacio').once('value'), 8000); state.espacioAdmin = es.val() || null; } catch (e) {}
  } else {
    try {
      const ps = await conTimeout(db.ref('perfiles/' + u.uid).once('value'), 15000);
      state.perfilActual = ps.val();
    } catch (e) {}
    if (!state.perfilActual || !state.perfilActual.puedeGestionarUsuarios) { window.location.href = 'index.html'; return; }
    state.userAdminScope = 'own';
  }
  if (!pedirPinYEntrar()) return;
  render();
  cargarListaUsuarios();
});
