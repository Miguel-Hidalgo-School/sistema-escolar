<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mural de Avisos · Sistema Escolar</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --primary:#2563eb; --primary-deep:#1d4ed8; --primary-soft:#eff6ff;
    --ink:#1f2937; --slate:#6b7280; --line:#e5e7eb; --bg:#f4f5f7; --white:#fff;
    --sage:#3f9165; --sage-soft:#ecfdf3;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',sans-serif;background:var(--bg);color:var(--ink);}
  .app{max-width:560px;margin:0 auto;padding:0 16px 48px;}
  header{text-align:center;padding:0 0 26px;color:#fff;background:linear-gradient(155deg,var(--primary),var(--primary-deep));border-radius:0 0 26px 26px;margin-bottom:22px;box-shadow:0 8px 24px -8px rgba(37,99,235,.45);overflow:hidden;}
  header .banner{width:100%;display:block;aspect-ratio:720/706;object-fit:cover;object-position:center 18%;}
  header .logo{width:56px;height:56px;border-radius:16px;object-fit:cover;background:#fff;margin:-30px auto 10px;position:relative;display:block;box-shadow:0 4px 10px rgba(0,0,0,.25);border:3px solid #fff;}
  header .icon{font-size:2.1em;margin:14px 0 2px;}
  header h1{font-family:'Baloo 2',sans-serif;font-size:1.35em;margin:4px 0 2px;letter-spacing:.01em;}
  header p{color:#dbe6ff;font-size:0.85em;margin:0;font-weight:500;}
  header #schoolName{font-size:.78em;color:#dbe6ff;opacity:.9;margin-top:2px;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;box-shadow:0 2px 10px -4px rgba(15,23,42,.06);}
  label{display:block;font-size:0.74em;font-weight:700;color:var(--slate);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;}
  .pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
  .pill{border:1.5px solid var(--line);background:#fff;color:#374151;padding:9px 17px;border-radius:20px;font-weight:700;font-size:0.87em;cursor:pointer;transition:.15s;}
  .pill:active{transform:scale(.96);}
  .pill.active{background:var(--primary);border-color:var(--primary);color:#fff;box-shadow:0 3px 0 var(--primary-deep);}

  .btn{width:100%;border:none;background:var(--primary);color:#fff;padding:14px;border-radius:12px;font-weight:800;font-size:0.98em;cursor:pointer;box-shadow:0 4px 0 var(--primary-deep);transition:.1s;}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--primary-deep);}
  .btn-ghost{background:#fff;color:var(--primary);border:1.5px solid var(--primary);box-shadow:none;}

  .change-link{display:flex;align-items:center;justify-content:center;gap:6px;font-size:0.82em;font-weight:700;color:var(--primary);margin-bottom:16px;cursor:pointer;background:var(--primary-soft);border-radius:10px;padding:10px;}

  .aviso{background:var(--white);border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:14px;padding:16px 18px;margin-bottom:13px;box-shadow:0 2px 8px -4px rgba(15,23,42,.07);animation:fadeIn .25s ease;}
  .aviso.todos{border-left-color:var(--sage);}
  .aviso .tag{display:inline-block;font-size:.68em;font-weight:800;letter-spacing:.03em;color:var(--sage);background:var(--sage-soft);padding:3px 9px;border-radius:20px;margin-bottom:8px;text-transform:uppercase;}
  .aviso.scoped .tag{color:var(--primary);background:var(--primary-soft);}
  .aviso h3{margin:0 0 7px;font-size:1.04em;font-weight:800;line-height:1.3;}
  .aviso p{margin:0;font-size:0.9em;color:#374151;white-space:pre-wrap;line-height:1.55;}
  .aviso .meta{margin-top:11px;padding-top:10px;border-top:1px dashed var(--line);font-size:0.74em;color:#9ca3af;display:flex;align-items:center;gap:5px;}

  .empty{text-align:center;color:#9ca3af;padding:52px 20px;font-size:0.92em;}
  .empty .big{font-size:2.4em;margin-bottom:10px;}
  .hidden{display:none;}
  .skeleton{background:linear-gradient(90deg,#eef0f3 25%,#e4e7ec 37%,#eef0f3 63%);background-size:400% 100%;animation:shimmer 1.4s infinite;border-radius:14px;height:78px;margin-bottom:13px;}
  @keyframes shimmer{0%{background-position:100% 50%;}100%{background-position:0 50%;}}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  footer{text-align:center;color:#b0b6c0;font-size:.72em;margin-top:28px;}
</style>
</head>
<body>
<div class="app">
  <header>
    <img src="mural-banner.jpg" alt="Anuncios de la escuela" class="banner" onerror="this.style.display='none';document.getElementById('headerIcon').classList.remove('hidden');">
    <img id="schoolLogo" class="logo hidden" alt="Logo">
    <div class="icon hidden" id="headerIcon">📢</div>
    <h1>Mural de Avisos</h1>
    <p id="subLabel">Selecciona el grupo de tu hijo/a</p>
    <p id="schoolName"></p>
  </header>

  <div class="card" id="selectorCard">
    <label>Nivel</label>
    <div class="pills" id="pillsNivel">
      <button class="pill" data-nivel="primaria" onclick="setNivel('primaria')">🎒 Primaria</button>
      <button class="pill" data-nivel="secundaria" onclick="setNivel('secundaria')">🎓 Secundaria</button>
    </div>
    <div id="gradoBlock" class="hidden">
      <label>Grado</label>
      <div class="pills" id="pillsGrado"></div>
    </div>
    <div id="grupoBlock" class="hidden">
      <label>Grupo (opcional)</label>
      <div class="pills" id="pillsGrupo"></div>
    </div>
    <button class="btn" id="verAvisosBtn" style="display:none;" onclick="verAvisos()">Ver avisos →</button>
  </div>

  <div id="avisosView" class="hidden">
    <div class="change-link" onclick="cambiarSeleccion()">✏️ Cambiar grupo</div>
    <div id="listaAvisos"></div>
  </div>

  <footer>Un sistema de <b>CHAVARRÍA PRODUCCIONES</b></footer>
</div>
<p id="diagMural" style="text-align:center;font-size:11px;color:#9ca3af;margin:18px 0 0;word-break:break-all;"></p>

<script>
const CK_FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFucnRd_ZB81l4rH7bAeNh3STqL4AN4R4",
  authDomain: "sistema-escolar-a5c31.firebaseapp.com",
  databaseURL: "https://sistema-escolar-a5c31-default-rtdb.firebaseio.com",
  projectId: "sistema-escolar-a5c31",
  storageBucket: "sistema-escolar-a5c31.firebasestorage.app",
  messagingSenderId: "234198294318",
  appId: "1:234198294318:web:a65521e9607753d68664bf"
};
firebase.initializeApp(CK_FIREBASE_CONFIG);
const db = firebase.database();
// Línea de diagnóstico (abajo de la página): ayuda a saber de dónde se leen los avisos.
const _diag = { proyecto: CK_FIREBASE_CONFIG.projectId, espacio: '', avisos: '-', error: '' };
function pintarDiag() {
  const el = document.getElementById('diagMural');
  if (el) el.textContent = 'Diagnóstico · ' + _diag.proyecto + ' · espacio: ' + (_diag.espacio || 'no encontrado') + ' · avisos: ' + _diag.avisos + (_diag.error ? ' · error: ' + _diag.error : '');
}

// Espacio (carpeta de la escuela) de este mural. El link que genera el Sistema Escolar
// trae ?e=<espacio>. Si un link viejo no lo trae, se usa el espacio compartido de los
// Súper Administradores (adminEspacio), para que los links ya enviados sigan funcionando.
const _qs = new URLSearchParams(window.location.search);
function obtenerEspacio() {
  const e = _qs.get('e') || _qs.get('escuela');
  if (e) return Promise.resolve(e.replace(/^usuarios\//, ''));
  return db.ref('adminEspacio').once('value').then(s => s.val() || '').catch(() => '');
}
let ESPACIO_MURAL = '';
const GRADOS_PRI = ['1°','2°','3°','4°','5°','6°'];
const GRADOS_SEC = ['1°','2°','3°'];
const GRUPOS_PRI = ['A','B','C','D'];
const GRUPOS_SEC = ['A','B','C','D','E','F'];

let sel = JSON.parse(localStorage.getItem('mural_seleccion') || 'null');
const _nivelUrl = _qs.get('nivel');
if ((_nivelUrl === 'primaria' || _nivelUrl === 'secundaria') && (!sel || sel.nivel !== _nivelUrl)) sel = { nivel: _nivelUrl, grade: '', grupo: '' };
let avisos = [];
let avisosCargados = false;

function setNivel(nivel) {
  sel = { nivel, grade: '', grupo: '' };
  actualizarLogoYNombre();
  render();
}
function setGrado(g) { sel.grade = g; sel.grupo = ''; render(); }
function setGrupo(g) { sel.grupo = sel.grupo === g ? '' : g; render(); }

function render() {
  document.querySelectorAll('#pillsNivel .pill').forEach(b => b.classList.toggle('active', sel && b.dataset.nivel === sel.nivel));
  const gradoBlock = document.getElementById('gradoBlock');
  const grupoBlock = document.getElementById('grupoBlock');
  const verBtn = document.getElementById('verAvisosBtn');
  if (!sel || !sel.nivel) { gradoBlock.classList.add('hidden'); grupoBlock.classList.add('hidden'); verBtn.style.display = 'none'; return; }
  gradoBlock.classList.remove('hidden');
  const grados = sel.nivel === 'primaria' ? GRADOS_PRI : GRADOS_SEC;
  document.getElementById('pillsGrado').innerHTML = grados.map(g => `<button class="pill ${sel.grade===g?'active':''}" onclick="setGrado('${g}')">${g}</button>`).join('');
  if (sel.grade) {
    grupoBlock.classList.remove('hidden');
    const gruposDisponibles = sel.nivel === 'secundaria' ? GRUPOS_SEC : GRUPOS_PRI;
    document.getElementById('pillsGrupo').innerHTML = gruposDisponibles.map(g => `<button class="pill ${sel.grupo===g?'active':''}" onclick="setGrupo('${g}')">Grupo ${g}</button>`).join('');
    verBtn.style.display = 'block';
  } else {
    grupoBlock.classList.add('hidden');
    verBtn.style.display = 'none';
  }
}

function verAvisos() {
  localStorage.setItem('mural_seleccion', JSON.stringify(sel));
  document.getElementById('selectorCard').classList.add('hidden');
  document.getElementById('avisosView').classList.remove('hidden');
  document.getElementById('subLabel').textContent = `${sel.nivel === 'primaria' ? '🎒 Primaria' : '🎓 Secundaria'} · ${sel.grade}${sel.grupo ? ' Grupo ' + sel.grupo : ''}`;
  renderAvisos();
}
function cambiarSeleccion() {
  document.getElementById('selectorCard').classList.remove('hidden');
  document.getElementById('avisosView').classList.add('hidden');
  document.getElementById('subLabel').textContent = 'Selecciona el grupo de tu hijo/a';
}

function tiempoRelativo(ts){
  const diffMs = Date.now() - ts;
  const min = Math.floor(diffMs/60000);
  if (min < 1) return 'justo ahora';
  if (min < 60) return `hace ${min} min`;
  const hrs = Math.floor(min/60);
  if (hrs < 24) return `hace ${hrs} h`;
  const dias = Math.floor(hrs/24);
  if (dias === 1) return 'ayer';
  if (dias < 7) return `hace ${dias} días`;
  return new Date(ts).toLocaleDateString('es-MX', { day: 'numeric', month: 'long' });
}

const _lista = x => x ? Object.values(x) : [];
function renderAvisos() {
  const lista = document.getElementById('listaAvisos');
  if (!avisosCargados) {
    lista.innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';
    return;
  }
  const filtrados = avisos.filter(a => {
    if (a.nivel === 'todos') return true;
    if (a.nivel !== sel.nivel) return false;
    const gs = _lista(a.grades), gps = _lista(a.grupos);
    if (gs.length && !gs.includes(sel.grade)) return false;
    if (gps.length && !gps.includes(sel.grupo)) return false;
    if (a.grade && a.grade !== sel.grade) return false;
    if (a.grupo && sel.grupo && a.grupo !== sel.grupo) return false;
    if (a.grupo && !sel.grupo) return false; // el aviso es de un grupo específico y el papá no eligió grupo
    return true;
  });
  window._filtradosActual = filtrados;
  if (!filtrados.length) {
    lista.innerHTML = '<div class="empty"><div class="big">📭</div>No hay avisos por ahora para este grupo.<br>Vuelve a checar más tarde.</div>';
    return;
  }
  lista.innerHTML = filtrados.map(a => {
    const fecha = new Date(a.createdAt).toLocaleDateString('es-MX', { day: 'numeric', month: 'long', year: 'numeric' });
    const esGeneral = a.nivel === 'todos';
    const tagTexto = esGeneral ? 'Para toda la escuela' : (a.grupo ? `${a.grade} Grupo ${a.grupo}` : (a.grade ? `${a.grade}` : (a.nivel === 'primaria' ? 'Primaria' : 'Secundaria')));
    return `<div class="aviso ${esGeneral ? 'todos' : 'scoped'}">
      <span class="tag">${escapeHtml(tagTexto)}</span>
      <h3>${escapeHtml(a.titulo)}</h3>
      <p>${escapeHtml(a.mensaje)}</p>
      <div class="meta">🕓 ${tiempoRelativo(a.createdAt)} · ${fecha}</div>
    </div>`;
  }).join('');
}
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function marcarCargado() { avisosCargados = true; if (!document.getElementById('avisosView').classList.contains('hidden')) renderAvisos(); }
const espacioListo = obtenerEspacio().then(esp => { ESPACIO_MURAL = esp; _diag.espacio = esp; pintarDiag(); return esp; });
espacioListo.then(esp => {
  if (!esp) { marcarCargado(); return; }
  const _fuentes = {};
  const _unir = () => { avisos = Object.values(_fuentes).reduce((acc, v) => acc.concat(Object.keys(v||{}).map(id => ({ id, ...v[id] }))), []).sort((a,b) => (b.createdAt||0) - (a.createdAt||0)); };
  if (!(_qs.get('e') || _qs.get('escuela'))) db.ref('Sistema Escolar/mural').on('value', s2 => { _fuentes.legacy = s2.val() || {}; _unir(); _diag.avisos = avisos.length; pintarDiag(); if (typeof renderAvisos==='function' && document.getElementById('avisosView') && !document.getElementById('avisosView').classList.contains('hidden')) renderAvisos(); }, () => {});
  db.ref('usuarios/' + esp + '/mural').on('value', snap => {
    _fuentes.espacio = snap.val() || {}; _unir();
    _diag.avisos = avisos.length; pintarDiag();
    marcarCargado();
  }, err => { _diag.error = (err && err.code) || 'sin permiso'; pintarDiag(); marcarCargado(); });
});

// Nombre/logo de la escuela — respeta un logo fijo del Mural si el docente
// subió uno; si no, usa el logo de Primaria o Secundaria según el nivel que
// elija cada papá/mamá (se actualiza en cuanto cambian de nivel).
let logoMural = '', logoPri = '', logoSec = '', nombrePri = '', nombreSec = '';
function actualizarLogoYNombre(){
  const nombre = (sel && sel.nivel === 'secundaria' ? nombreSec : nombrePri) || nombrePri || nombreSec;
  document.getElementById('schoolName').textContent = nombre || '';
  const logo = logoMural || (sel && sel.nivel === 'secundaria' ? logoSec : logoPri);
  const img = document.getElementById('schoolLogo');
  if (logo && logo.trim()) {
    img.onload = () => { img.classList.remove('hidden'); document.getElementById('headerIcon').classList.add('hidden'); };
    img.onerror = () => { img.classList.add('hidden'); document.getElementById('headerIcon').classList.remove('hidden'); };
    img.src = logo.trim();
  } else {
    img.classList.add('hidden');
    document.getElementById('headerIcon').classList.remove('hidden');
  }
}
// Solo se leen los campos públicos (nombre y logo): el resto de los datos de la escuela es privado.
espacioListo.then(esp => {
  if (!esp) return;
  const leer = ruta => db.ref('usuarios/' + esp + '/' + ruta).once('value').then(s => s.val() || '').catch(() => '');
  return Promise.all([leer('schoolInfo/logoURL'), leer('schoolInfo/nombre'), leer('secSchoolInfo/logoURL'), leer('secSchoolInfo/nombre'), leer('muralConfig/logoURL')])
    .then(([lp, np, ls, ns, lm]) => {
      logoPri = lp; nombrePri = np; logoSec = ls; nombreSec = ns; logoMural = lm;
      actualizarLogoYNombre();
    });
});

render();
if (sel && sel.nivel && sel.grade) { verAvisos(); }
pintarDiag();
</script>
<script>
/* ===== Lector de avisos en audio (voz del propio teléfono, sin costo) ===== */
(function(){
  if (!('speechSynthesis' in window)) return;
  const st = { gesto: false };
  const get = k => { try { return localStorage.getItem(k); } catch(e) { return null; } };
  const set = (k,v) => { try { localStorage.setItem(k,v); } catch(e) {} };
  const auto = () => get('mural_audio_auto') !== '0';          // activado por defecto
  function voz(){ const v = speechSynthesis.getVoices(); return v.find(x => /es[-_]MX/i.test(x.lang)) || v.find(x => /^es/i.test(x.lang)) || null; }
  function limpio(t){ t = String(t||''); const m = t.match(/[A-Za-zÁÉÍÓÚÑáéíóúñ]/g) || []; const may = (t.match(/[A-ZÁÉÍÓÚÑ]/g) || []).length; return (m.length && may/m.length > 0.7) ? t.toLowerCase() : t; }
  function leer(a){ if (!a) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(limpio(a.titulo) + '. ' + limpio(a.mensaje)); u.lang = 'es-MX'; const v = voz(); if (v) u.voice = v; u.rate = 0.95; speechSynthesis.speak(u); }
  function ultimo(){ const f = window._filtradosActual || []; return f[0] || null; }
  // Al elegir el grado y tocar "Ver avisos" se reproduce solo el último aviso.
  // Si los avisos aún no cargan, queda pendiente y suena en cuanto llegan.
  let pendiente = false;
  function intentarPendiente(){ if (!pendiente) return; const a = ultimo(); if (!a) return; pendiente = false; leer(a); }
  window.leerUltimoAviso = () => { st.gesto = true; const a = ultimo(); if (a) leer(a); };
  window.leerAvisoPorIndice = i => { st.gesto = true; leer((window._filtradosActual || [])[i]); };
  window.detenerAudio = () => speechSynthesis.cancel();
  window.cambiarAudioAuto = on => { set('mural_audio_auto', on ? '1' : '0'); if (!on) speechSynthesis.cancel(); };
  function decorar(){
    const lista = document.getElementById('listaAvisos'); if (!lista) return;
    const items = lista.querySelectorAll('.aviso');
    items.forEach((el, i) => { if (el.querySelector('.aud-btn')) return; const b = document.createElement('button'); b.className = 'aud-btn'; b.type = 'button'; b.textContent = '🔊 Escuchar'; b.onclick = () => window.leerAvisoPorIndice(i); el.appendChild(b); });
    if (items.length && !document.getElementById('audioBar')) {
      const bar = document.createElement('div'); bar.id = 'audioBar'; bar.className = 'audiobar';
      bar.innerHTML = '<button type="button" class="aud-main" onclick="leerUltimoAviso()">🔊 Toca aquí para escuchar el último aviso</button><p class="aud-nota">Si no se reproduce solo, toca el botón azul para oírlo.</p><button type="button" class="aud-stop" onclick="detenerAudio()">⏹ Parar</button><label><input type="checkbox" id="chkAudioAuto" onchange="cambiarAudioAuto(this.checked)"' + (auto() ? ' checked' : '') + '> Reproducir solo al elegir mi grado</label>';
      lista.insertBefore(bar, lista.firstChild);
    }
    intentarPendiente();
  }
  const css = document.createElement('style');
  css.textContent = '.audiobar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px;padding:12px;background:#eff6ff;border:1px solid #bfdbfe;border-radius:12px}.audiobar .aud-main{flex:1 1 100%;border:none;background:#2563eb;color:#fff;font-weight:700;font-size:1em;padding:13px;border-radius:10px;cursor:pointer}.audiobar .aud-stop{border:1px solid #93c5fd;background:#fff;color:#1d4ed8;font-weight:600;padding:8px 12px;border-radius:10px;cursor:pointer}.audiobar .aud-nota{flex:1 1 100%;margin:0;font-size:.78em;color:#4b5563}.audiobar label{font-size:.8em;color:#374151;display:flex;gap:6px;align-items:center}.aud-btn{margin-top:10px;border:1px solid #d1d5db;background:#f9fafb;color:#374151;font-weight:600;font-size:.8em;padding:6px 12px;border-radius:8px;cursor:pointer}';
  document.head.appendChild(css);
  const orig = window.renderAvisos;
  window.renderAvisos = function(){ const r = orig.apply(this, arguments); decorar(); return r; };
  renderAvisos = window.renderAvisos;
  // El navegador solo permite sonido después de que la persona toca la pantalla.
  const verOrig = window.verAvisos;
  if (typeof verOrig === 'function') {
    window.verAvisos = function(){ st.gesto = true; const r = verOrig.apply(this, arguments); if (auto()) { pendiente = true; intentarPendiente(); } return r; };
    verAvisos = window.verAvisos;
  }
  const v = document.getElementById('avisosView'); if (v && !v.classList.contains('hidden')) renderAvisos();
})();
</script>
</body>
</html>
