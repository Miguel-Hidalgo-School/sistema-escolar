<script>
// ---------------- Config ----------------
const GRADOS = ['1°','2°','3°','4°','5°','6°'];
const GRADOS_SEC = ['1°','2°','3°'];
const GRUPOS_SEC = ['A','B','C','D','E','F'];
const MATERIAS = ['Lenguajes','Saberes y Pensamiento Científico','Ética, Naturaleza y Sociedades','De lo Humano y lo Comunitario'];
const PERIODOS_LABEL = ['1er','2do','3er'];
const PERIODOS_FECHAS = ['Septiembre - Noviembre','Noviembre - Marzo','Marzo - Junio'];
const CALIF_FINAL_MINIMA_SEC = 18;
const DB_ROOT = 'Sistema Escolar'; // coincide con tus reglas de Realtime Database
const REQUIRED_EMAIL_DOMAIN = '@chavarria.edu.com'; // todas las cuentas de acceso deben usar este dominio

// Configuración fija de Firebase (ya no se pide en cada dispositivo/navegador)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFucnRd_ZB81l4rH7bAeNh3STqL4AN4R4",
  authDomain: "sistema-escolar-a5c31.firebaseapp.com",
  databaseURL: "https://sistema-escolar-a5c31-default-rtdb.firebaseio.com",
  projectId: "sistema-escolar-a5c31",
  storageBucket: "sistema-escolar-a5c31.firebasestorage.app",
  messagingSenderId: "234198294318",
  appId: "1:234198294318:web:a65521e9607753d68664bf"
};

let auth = null, db = null, storage = null;
let currentUid = null;
let secondaryApp = null;
let studentsRef = null, schoolRef = null, secStudentsRef = null, secSchoolRef = null, formativosPriRef = null, formativosSecRef = null, tareasPriRef = null, tareasSecRef = null, disciplinaPriRef = null, disciplinaSecRef = null;
let state = {
configDone: true,
fbConfig: FIREBASE_CONFIG,
user: null,
authError: '',
nivel: null,
tab: 'inicio',
secTab: 'inicio',
tabHistory: [],
students: [],
schoolInfo: { nombre: '', cct: '', autoridadNombre: '', autoridadCargo: 'DIRECTOR(A)' },
selectedGrade: '1°',
diplomaGrade: '1°',
editingStudentId: null,
obsPeriodo: {},
boletaStudentId: null,
shareLinkUrl: null,
shareLinkLoading: false,
importSummary: null,
honorGrade: '1°',
honorPeriodo: 0,
secStudents: [],
secSchoolInfo: { nombre: '', cct: '', materia: '', docente: '', logoURL: '', logoURL2: '' },
secSelectedGrade: '1°',
secSelectedGrupo: 'A',
secEditingId: null,
secDatosEditingId: null,
secReportGrade: null,
formativosPri: {},
formativosSec: {},
formativoStudentId: null,
formativoForm: null,
formativoSaving: false,
formativoShareUrl: null,
formativoShareLoading: false,
formativoShareTel: '',
formativoAcuseInfo: null,
formativoFilterGrade: '',
formativoFilterGrupo: '',
tareasPri: {},
tareasSec: {},
tareaNueva: null,
tareaSelectedId: null,
tareaFilterGrade: '',
tareaFilterGrupo: '',
tareaFilterMateria: '',
tareaShareUrl: null,
tareaShareLoading: false,
tareaShareSelectedId: '',
tareaPrintMode: false,
disciplinaPri: {},
disciplinaSec: {},
disciplinaStudentId: null,
disciplinaIncidenteNuevo: null,
disciplinaReportMode: null,
disciplinaShareUrl: null,
disciplinaShareLoading: false,
disciplinaFilterGrade: '',
disciplinaFilterGrupo: '',
// ---- Multiusuario ----
isAdmin: false,
forcePasswordChange: false,
perfilActual: null,
showUserAdmin: false,
adminUsersList: null,
adminUsersLoading: false,
newUserPhone: '',
pwForm: { current: '', pass1: '', pass2: '' },
pwSaving: false,
pwError: '',
showCambiarPassword: false,
};
function emptyExtra() {
return {
foto:'', curp:'', matricula:'', turno:'', grupo:'', lenguaIndigena:'', asistencias:'', folio:'', fechaNacimiento:'',
madreNombre:'', madreCurp:'', madreTelefono:'', madreDireccion:'',
padreNombre:'', padreCurp:'', padreTelefono:'', padreDireccion:'',
tutorNombre:'', tutorCurp:'', tutorTelefono:'', tutorDireccion:''
};
}
function normalizeGrado(raw) {
if (raw === undefined || raw === null) return null;
const s = String(raw).trim();
const digit = s.match(/\d/);
if (digit) { const m = GRADOS.find(g => g.startsWith(digit[0])); if (m) return m; }
return GRADOS.find(g => g === s) || null;
}
function getCicloEscolar() {
const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
return m >= 7 ? (y + '-' + (y+1)) : ((y-1) + '-' + y);
}
function calcularEdad(fechaNacimiento, curp) {
let birthDate = null;
if (fechaNacimiento) {
birthDate = new Date(fechaNacimiento + 'T00:00:00');
} else if (curp && curp.length >= 10) {
const yy = curp.substring(4,6), mm = curp.substring(6,8), dd = curp.substring(8,10);
if (/^\d{2}$/.test(yy) && /^\d{2}$/.test(mm) && /^\d{2}$/.test(dd)) {
const yearNum = parseInt(yy,10);
const century = yearNum <= (new Date().getFullYear()%100) ? 2000 : 1900;
birthDate = new Date(century+yearNum, parseInt(mm,10)-1, parseInt(dd,10));
}
}
if (!birthDate || isNaN(birthDate.getTime())) return null;
const today = new Date();
let age = today.getFullYear() - birthDate.getFullYear();
const m = today.getMonth() - birthDate.getMonth();
if (m < 0 || (m===0 && today.getDate() < birthDate.getDate())) age--;
return (age>=0 && age<25) ? age : null;
}
function studentAverage(s) {
const vals = [];
MATERIAS.forEach(m => (s.grades && s.grades[m] || []).forEach(v => { if (typeof v === 'number') vals.push(v); }));
return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function subjectAverage(s, m) {
const vals = (s.grades && s.grades[m] || []).filter(v => typeof v === 'number');
return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function showToast(msg) {
const box = document.getElementById('toastBox');
box.innerHTML = '<div class="toast">'+msg+'</div>';
setTimeout(()=>{ box.innerHTML=''; }, 2600);
}
// ---------------- Firebase Init ----------------
// Cada usuario (el administrador y cada cuenta que él cree) tiene su propia
// carpeta de datos, totalmente separada de las demás:
//  - El administrador (la primera cuenta, la que ya existía) sigue usando
//    la raíz original "Sistema Escolar", tal cual siempre lo ha hecho.
//  - Cada cuenta nueva creada desde "Usuarios" usa su propia carpeta
//    "usuarios/<uid>/...", que solo esa persona (y el administrador) pueden ver.
function dbBase() {
return state.isAdmin ? DB_ROOT : ('usuarios/' + currentUid);
}
function bindRefs() {
const base = dbBase();
studentsRef = db.ref(base + '/students');
schoolRef = db.ref(base + '/schoolInfo');
secStudentsRef = db.ref(base + '/secStudents');
secSchoolRef = db.ref(base + '/secSchoolInfo');
formativosPriRef = db.ref(base + '/formativos/primaria');
formativosSecRef = db.ref(base + '/formativos/secundaria');
tareasPriRef = db.ref(base + '/tareas/primaria');
tareasSecRef = db.ref(base + '/tareas/secundaria');
disciplinaPriRef = db.ref(base + '/disciplina/primaria');
disciplinaSecRef = db.ref(base + '/disciplina/secundaria');
}
function initFirebase() {
firebase.initializeApp(state.fbConfig);
auth = firebase.auth();
db = firebase.database();
auth.onAuthStateChanged(async u => {
state.user = u;
state.authError = '';
state.forcePasswordChange = false;
state.isAdmin = false;
state.perfilActual = null;
if (u) {
currentUid = u.uid;
try {
const adminSnap = await db.ref('admins/' + currentUid).once('value');
if (adminSnap.val() === true) {
state.isAdmin = true;
} else {
// Intentamos auto-reclamarnos como administrador. La regla de seguridad
// solo deja que esto funcione si todavía no existe ningún administrador;
// si ya hay uno (y no eres tú), este intento simplemente falla y no pasa nada.
try {
await db.ref('admins/' + currentUid).set(true);
state.isAdmin = true;
} catch (e2) { /* ya existe un administrador distinto */ }
}
} catch (e) { /* si las reglas aún no están configuradas, seguimos sin bloquear */ }
try {
const perfilSnap = await db.ref('perfiles/' + currentUid).once('value');
state.perfilActual = perfilSnap.val();
if (state.perfilActual && state.perfilActual.mustChangePassword) {
state.forcePasswordChange = true;
}
} catch (e) { /* sin perfil = cuenta antigua / administrador original */ }
bindRefs();
if (!state.forcePasswordChange) subscribeData();
} else {
currentUid = null;
unsubscribeData();
}
render();
});
render();
}
function subscribeData() {
studentsRef.on('value', snap => {
const val = snap.val() || {};
state.students = Object.keys(val).map(id => ({ id, ...val[id] }));
render();
}, err => { showToast('Permisos insuficientes: revisa las reglas de la base de datos.'); });
schoolRef.on('value', snap => {
if (snap.val()) state.schoolInfo = snap.val();
render();
});
secStudentsRef.on('value', snap => {
const val = snap.val() || {};
state.secStudents = Object.keys(val).map(id => ({ id, ...val[id] }));
render();
}, () => {});
secSchoolRef.on('value', snap => {
if (snap.val()) state.secSchoolInfo = snap.val();
render();
});
formativosPriRef.on('value', snap => { state.formativosPri = snap.val() || {}; render(); }, () => {});
formativosSecRef.on('value', snap => { state.formativosSec = snap.val() || {}; render(); }, () => {});
tareasPriRef.on('value', snap => { state.tareasPri = snap.val() || {}; render(); }, () => {});
tareasSecRef.on('value', snap => { state.tareasSec = snap.val() || {}; render(); }, () => {});
disciplinaPriRef.on('value', snap => { state.disciplinaPri = snap.val() || {}; render(); }, () => {});
disciplinaSecRef.on('value', snap => { state.disciplinaSec = snap.val() || {}; render(); }, () => {});
}
function unsubscribeData() {
if (studentsRef) studentsRef.off();
if (schoolRef) schoolRef.off();
if (secStudentsRef) secStudentsRef.off();
if (secSchoolRef) secSchoolRef.off();
if (formativosPriRef) formativosPriRef.off();
if (formativosSecRef) formativosSecRef.off();
if (tareasPriRef) tareasPriRef.off();
if (tareasSecRef) tareasSecRef.off();
if (disciplinaPriRef) disciplinaPriRef.off();
if (disciplinaSecRef) disciplinaSecRef.off();
state.students = [];
state.secStudents = [];
state.formativosPri = {};
state.formativosSec = {};

function handleImportFile(e) {
const file = e.target.files && e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = async (ev) => {
try {
const data = new Uint8Array(ev.target.result);
const wb = XLSX.read(data, { type: 'array' });
const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
let added=0, updated=0, skipped=0;
for (const row of rows) {
const name = String(row['Nombre']||row['nombre']||'').trim();
const grado = normalizeGrado(row['Grado']||row['grado']);
if (!name || !grado) { skipped++; continue; }
let s = state.students.find(x => x.name.toLowerCase()===name.toLowerCase() && x.grade===grado);
const id = s ? s.id : studentsRef.push().key;
const grades = s ? { ...s.grades } : {};
MATERIAS.forEach(m => {
[1,2,3].forEach(t => {
const key = m+' P'+t;
if (row[key] !== undefined && row[key] !== '') {
const val = Math.max(0, Math.min(10, Number(row[key])));
if (!isNaN(val)) {
const arr = grades[m] ? [...grades[m]] : [null,null,null];
arr[t-1] = val;
grades[m] = arr;
}
}
});
});
await studentsRef.child(id).update({ name, grade: grado, grades, observaciones: s ? (s.observaciones||{}) : {}, ...(s ? {} : emptyExtra()) });
s ? updated++ : added++;
}
state.importSummary = { added, updated, skipped, total: rows.length };
showToast('Importados: '+added+' nuevos, '+updated+' actualizados');
render();
} catch(err) {
showToast('Error al leer el archivo. Usa el formato de la plantilla.');
}
};
reader.readAsArrayBuffer(file);
}

function resizeImageToBase64(file, maxSize, quality, onDone, onError) {
const reader = new FileReader();
reader.onload = (e) => {
const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
onDone(canvas.toDataURL('image/jpeg', quality));
};
img.onerror = () => onError && onError();
img.src = e.target.result;
};
reader.onerror = () => onError && onError();
reader.readAsDataURL(file);
}
