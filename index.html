<script>

const CALIF_FINAL_MINIMA_SEC = 18;

const ADMIN_EMAIL = 'educacion@chavarria.edu.com'; // única cuenta que es administradora de todo el sistema

// Configuración fija de Firebase (ya no se pide en cada dispositivo/navegador)
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAFucnRd_ZB81l4rH7bAeNh3STqL4AN4R4",
  authDomain: "sistema-escolar-a5c31.firebaseapp.com",
  databaseURL: "https://sistema-escolar-a5c31-default-rtdb.firebaseio.com",
  projectId: "sistema-escolar-a5c31",
  storageBucket: "sistema-escolar-a5c31.firebasestorage.app",
  messagingSenderId: "234198294318",
  appId: "1:234198294318:web:a65521e9607753d68664bf"
};

let auth = null, db = null, storage = null;
let currentUid = null;
let secondaryApp = null;
let studentsRef = null, schoolRef = null, secStudentsRef = null, secSchoolRef = null, formativosPriRef = null, formativosSecRef = null, tareasPriRef = null, tareasSecRef = null, disciplinaPriRef = null, disciplinaSecRef = null, checkinAttendanceRef = null;
let sumativaConfigPriRef = null, sumativaConfigSecRef = null, sumativaCalifPriRef = null, sumativaCalifSecRef = null, sumativaPeriodosRef = null;
let state = {

honorPeriodo: 0,

formativosSec: {},

formativoShareTel: '',

sumativaCalifSec: {},
sumativaFilterGrade: null,

sumativaFilterMateria: null,
sumativaPeriodos: null,
sumativaPeriodoActivo: 'p1',
sumativaEditandoPeriodos: false,

mostrarModalTerminos: false,
intentosScreenshot: 0,
bloqueadoPorScreenshot: false,
checkinAttendance: [],
tareaSelectedId: null,
tareaFilterGrade: '',
tareaFilterGrupo: '',
tareaFilterMateria: '',
tareaShareUrl: null,
tareaShareLoading: false,
tareaShareSelectedId: '',
tareaPrintMode: false,
disciplinaPri: {},
disciplinaSec: {},
disciplinaStudentId: null,
disciplinaIncidenteNuevo: null,
disciplinaReportMode: null,
disciplinaShareUrl: null,
disciplinaShareLoading: false,
disciplinaFilterGrade: '',
disciplinaFilterGrupo: '',
// ---- Multiusuario ----
isAdmin: false,
forcePasswordChange: false,
perfilActual: null,
showUserAdmin: false,
userAdminScope: 'all', // 'all' = administrador global ve/gestiona a todos; 'own' = usuario delegado solo ve los suyos
adminUsersList: null,

newUserPhone: '',
pwForm: { current: '', pass1: '', pass2: '' },

};
function emptyExtra() {
return {
foto:'', curp:'', matricula:'', turno:'', grupo:'', lenguaIndigena:'', asistencias:'', folio:'', fechaNacimiento:'',
madreNombre:'', madreCurp:'', madreTelefono:'', madreDireccion:'',
padreNombre:'', padreCurp:'', padreTelefono:'', padreDireccion:'',
tutorNombre:'', tutorCurp:'', tutorTelefono:'', tutorDireccion:''
};
}
function normalizeGrado(raw) {
if (raw === undefined || raw === null) return null;
const s = String(raw).trim();
const digit = s.match(/\d/);
if (digit) { const m = GRADOS.find(g => g.startsWith(digit[0])); if (m) return m; }
return GRADOS.find(g => g === s) || null;
}
function getCicloEscolar() {
const now = new Date(); const y = now.getFullYear(); const m = now.getMonth();
return m >= 7 ? (y + '-' + (y+1)) : ((y-1) + '-' + y);
}
function calcularEdad(fechaNacimiento, curp) {
let birthDate = null;
if (fechaNacimiento) {
birthDate = new Date(fechaNacimiento + 'T00:00:00');
} else if (curp && curp.length >= 10) {
const yy = curp.substring(4,6), mm = curp.substring(6,8), dd = curp.substring(8,10);
if (/^\d{2}$/.test(yy) && /^\d{2}$/.test(mm) && /^\d{2}$/.test(dd)) {
const yearNum = parseInt(yy,10);
const century = yearNum <= (new Date().getFullYear()%100) ? 2000 : 1900;
birthDate = new Date(century+yearNum, parseInt(mm,10)-1, parseInt(dd,10));
}
}
if (!birthDate || isNaN(birthDate.getTime())) return null;
const today = new Date();
let age = today.getFullYear() - birthDate.getFullYear();
const m = today.getMonth() - birthDate.getMonth();
if (m < 0 || (m===0 && today.getDate() < birthDate.getDate())) age--;
return (age>=0 && age<25) ? age : null;
}
function studentAverage(s) {
const vals = [];
MATERIAS.forEach(m => (s.grades && s.grades[m] || []).forEach(v => { if (typeof v === 'number') vals.push(v); }));
return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function subjectAverage(s, m) {
const vals = (s.grades && s.grades[m] || []).filter(v => typeof v === 'number');
return vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
}
function showToast(msg) {

setTimeout(()=>{ box.innerHTML=''; }, 2600);
}
// ---------------- Firebase Init ----------------
// Cada usuario (el administrador y cada cuenta que él cree) tiene su propia
// carpeta de datos, totalmente separada de las demás:
//  - El administrador (la primera cuenta, la que ya existía) sigue usando
//    la raíz original "Sistema Escolar", tal cual siempre lo ha hecho.
//  - Cada cuenta nueva creada desde "Usuarios" usa su propia carpeta
//    "usuarios/<uid>/...", que solo esa persona (y el administrador) pueden ver.
function dbBase() {
if (state.isAdmin) return DB_ROOT;
const espacio = (state.perfilActual && state.perfilActual.espacioUid) || currentUid;
return 'usuarios/' + espacio;
}
function bindRefs() {
const base = dbBase();
studentsRef = db.ref(base + '/students');
schoolRef = db.ref(base + '/schoolInfo');
secStudentsRef = db.ref(base + '/secStudents');
secSchoolRef = db.ref(base + '/secSchoolInfo');
formativosPriRef = db.ref(base + '/formativos/primaria');
formativosSecRef = db.ref(base + '/formativos/secundaria');
tareasPriRef = db.ref(base + '/tareas/primaria');
tareasSecRef = db.ref(base + '/tareas/secundaria');
disciplinaPriRef = db.ref(base + '/disciplina/primaria');
disciplinaSecRef = db.ref(base + '/disciplina/secundaria');
sumativaConfigPriRef = db.ref(base + '/sumativaConfig/primaria');
sumativaConfigSecRef = db.ref(base + '/sumativaConfig/secundaria');
sumativaCalifPriRef = db.ref(base + '/sumativaCalif/primaria');
sumativaCalifSecRef = db.ref(base + '/sumativaCalif/secundaria');
sumativaPeriodosRef = db.ref(base + '/sumativaPeriodos');
checkinAttendanceRef = db.ref(base + '/checkinAttendance');
}
function initFirebase() {
firebase.initializeApp(state.fbConfig);
auth = firebase.auth();
db = firebase.database();
// Todo lo que debe pasar justo después de que una cuenta ya tiene los términos
// aceptados: saber si es admin, si debe forzar cambio de contraseña, si debe
// redirigirse a Bitácora por ser cuenta "solo-Bitácora", y conectar los listeners
// de Firebase. Se usa tanto en un login normal (términos ya aceptados de antes)
// como justo después de aceptar los términos por primera vez, para que la cuenta
// NUNCA se quede varada en una pantalla sin avanzar.
async function continuarSesionPostTerminos() {
// Solo la cuenta oficial del administrador (por correo) puede tener privilegios
// de administrador; ninguna otra cuenta puede auto-otorgárselos.
const email = (state.user && state.user.email) || (auth.currentUser && auth.currentUser.email) || '';
if (email && email.toLowerCase() === ADMIN_EMAIL) {
state.isAdmin = true;
try { await db.ref('admins/' + currentUid).set(true); } catch (e2) { /* las reglas ya lo protegen */ }
} else {
try {
const adminSnap = await db.ref('admins/' + currentUid).once('value');
state.isAdmin = adminSnap.val() === true;
} catch (e) { state.isAdmin = false; }
}
if (state.perfilActual && state.perfilActual.mustChangePassword) {
state.forcePasswordChange = true;
}
// Redirección post-login: si la cuenta SOLO tiene permiso de Bitácora (nada de
// Primaria/Secundaria/CheckIn Kids), jamás debe ver el selector principal ni las
// tarjetas de esos 3 sistemas. Se manda directo a bitacora-home.html, su única
// puerta de entrada/salida. Esto se hace después de resolver el cambio de
// contraseña obligatorio (si aplica) para no interrumpir ese flujo.
if (!state.forcePasswordChange && esSoloBitacora()) {
window.location.href = 'bitacora-home.html';
return true; // avisa al que llamó que ya se está navegando fuera de esta página
}
bindRefs();
if (!state.forcePasswordChange) subscribeData();

function handleImportFile(e) {
const file = e.target.files && e.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = async (ev) => {
try {
const data = new Uint8Array(ev.target.result);
const wb = XLSX.read(data, { type: 'array' });
const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
let added=0, updated=0, skipped=0;
for (const row of rows) {
const name = String(row['Nombre']||row['nombre']||'').trim();
const grado = normalizeGrado(row['Grado']||row['grado']);
if (!name || !grado) { skipped++; continue; }
let s = state.students.find(x => x.name.toLowerCase()===name.toLowerCase() && x.grade===grado);
const id = s ? s.id : studentsRef.push().key;
const grades = s ? { ...s.grades } : {};
MATERIAS.forEach(m => {
[1,2,3].forEach(t => {
const key = m+' P'+t;
if (row[key] !== undefined && row[key] !== '') {
const val = Math.max(0, Math.min(10, Number(row[key])));
if (!isNaN(val)) {
const arr = grades[m] ? [...grades[m]] : [null,null,null];
arr[t-1] = val;
grades[m] = arr;
}
}

function resizeImageToBase64(file, maxSize, quality, onDone, onError) {
const reader = new FileReader();
reader.onload = (e) => {
const img = new Image();
img.onload = () => {
let w = img.width, h = img.height;
if (w > h) { if (w > maxSize) { h = Math.round(h * maxSize / w); w = maxSize; } }
else { if (h > maxSize) { w = Math.round(w * maxSize / h); h = maxSize; } }
const canvas = document.createElement('canvas');
canvas.width = w; canvas.height = h;
const ctx = canvas.getContext('2d');
ctx.drawImage(img, 0, 0, w, h);
onDone(canvas.toDataURL('image/jpeg', quality));
};
img.onerror = () => onError && onError();
img.src = e.target.result;
};
reader.onerror = () => onError && onError();
reader.readAsDataURL(file);
}

function detectarIntentosScreenshot() {
  // Detecta teclas comunes para screenshot
  document.addEventListener('keydown', e => {
    if (state.bloqueadoPorScreenshot) return;
    const esScreenshot = (e.key === 'PrintScreen') || 
                         (e.ctrlKey && e.shiftKey && e.key === 's') || // Ctrl+Shift+S
                         (e.metaKey && e.shiftKey && e.key === '3') ||  // Mac
                         (e.metaKey && e.shiftKey && e.key === '4');
    if (esScreenshot) {
      e.preventDefault();
      manejarIntentosScreenshot();
    }
  });
  
  // Detecta context menu (click derecho)
  document.addEventListener('contextmenu', e => {
    if (state.bloqueadoPorScreenshot) return;
    // Opcional: bloquear clic derecho
    // e.preventDefault();
  });
}

async function manejarIntentosScreenshot() {
  state.intentosScreenshot++;
  const intentoNum = state.intentosScreenshot;
  
  showToast('⚠️ Intento de captura detectado. Sistema de protección activado.');
  
  // Registra en Firebase
  if (currentUid) {
    try {
      await db.ref(`auditoria/${currentUid}/intentosScreenshot/${Date.now()}`).set({
        timestamp: new Date().toISOString(),
        intento: intentoNum,
        ip: 'detectado-en-navegador'
      });
    } catch (e) { console.log('Error registrando intento'); }
  }
  
  // Si hay 3+ intentos, bloquea la cuenta
  if (intentoNum >= 3) {
    state.bloqueadoPorScreenshot = true;
    if (currentUid) {
      await db.ref('perfiles/' + currentUid).update({ bloqueadoPorScreenshot: true, bloqueadoEn: new Date().toISOString() });
    }
    showToast('🚫 Tu cuenta ha sido bloqueada por violación de protección de datos.');
    render();
  }
}

function render() {
const app = document.getElementById('app');
if (!auth) { app.innerHTML = '<div class="center-screen"><p>Cargando...</p></div>'; return; }
if (!state.user) { app.innerHTML = renderLogin(); return; }
// MOSTRAR MODAL DE TÉRMINOS (BLOQUEADOR) ANTES DE CUALQUIER OTRA COSA
if (state.mostrarModalTerminos) {
  app.innerHTML = renderModalTerminos();
  // Event listener para checkbox (fixup inmediato)
  const ck = document.getElementById('checkAcepto');
  const btn = document.getElementById('btnAceptarTerminos');
  if (ck && btn) {
    ck.addEventListener('change', () => {
      btn.disabled = !ck.checked;
      btn.style.opacity = ck.checked ? '1' : '0.5';
    });
  }
  return; // Detiene render aquí, no muestra nada más
}
if (state.forcePasswordChange) { app.innerHTML = renderTopbarSimple() + renderCambiarPassword(true); return; }
// Red de seguridad: si en cualquier punto del ciclo de vida de la página (por ejemplo,
// justo después de completar un cambio de contraseña obligatorio) resulta que la cuenta
// es "solo-Bitácora", nunca se le debe pintar el selector principal ni ninguna otra
// pantalla de este archivo — se manda de inmediato a su única puerta: bitacora-home.html.
if (esSoloBitacora()) { window.location.href = 'bitacora-home.html'; return; }
if (state.showCambiarPassword) { app.innerHTML = renderTopbarSimple() + renderCambiarPassword(false); return; }
if (state.showUserAdmin) { app.innerHTML = renderTopbarSimple() + renderAdminUsuarios(); return; }
if (!state.nivel) { app.innerHTML = renderTopbarSimple() + renderNivelSelector(); return; }
if (state.nivel === 'primaria') {
app.innerHTML = renderTopbar() + renderTabs() + '<main>' + renderTabContent() + '</main>';
} else {
app.innerHTML = renderTopbar() + renderSecTabs() + '<main>' + renderSecTabContent() + '</main>';
}
}

async function compartirTareasAlumno(nivel, studentId) {
if (!studentId) { showToast('Selecciona un alumno primero'); return; }
const map = nivel === 'primaria' ? state.tareasPri : state.tareasSec;
const list = nivel === 'primaria' ? state.students : state.secStudents;
const s = list.find(x => x.id === studentId);
if (!s) return;
const tareasAlumno = Object.values(map).filter(t => t.entregas && t.entregas[studentId]).map(t => ({
titulo: t.titulo, tipo: t.tipo, materia: t.materia || '', fecha: t.fecha || '',
cumplio: !!t.entregas[studentId].cumplio,
calificacion: t.entregas[studentId].calificacion === undefined ? null : t.entregas[studentId].calificacion,
observaciones: t.entregas[studentId].observaciones || ''
})).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
if (!tareasAlumno.length) { showToast('Este alumno no tiene tareas registradas todavía'); return; }
state.tareaShareLoading = true; render();
const safetyTimeout = setTimeout(() => {
if (state.tareaShareLoading) { state.tareaShareLoading = false; showToast('Tardó demasiado, intenta de nuevo'); render(); }
}, 12000);
try {
const tokenPointerRef = db.ref(DB_ROOT + '/tareasShareTokens/' + nivel + '/' + studentId);
const snap = await tokenPointerRef.once('value');
const oldToken = snap.val();
if (oldToken) {
await db.ref(DB_ROOT + '/reportesTareasCompartidos/' + oldToken).update({ expiresAt: Date.now() }).catch(() => {});
}
const ref = db.ref(DB_ROOT + '/reportesTareasCompartidos').push();
const token = ref.key;
const now = Date.now();
const expiresAt = now + 15 * 24 * 60 * 60 * 1000;
const si = nivel === 'primaria' ? state.schoolInfo : state.secSchoolInfo;
await ref.set({
nivel, studentName: s.name || '', grade: s.grade || '', grupo: s.grupo || '',
schoolName: si.nombre || '', tareas: tareasAlumno, createdAt: now, expiresAt
});
await tokenPointerRef.set(token);
const base = window.location.href.replace(/index\.html.*$/, '').replace(/\/?$/, '/');
state.tareaShareUrl = base + 'tareas.html?t=' + token;
} catch (err) {
console.error('compartirTareasAlumno error:', err);
showToast('No se pudo generar el link: ' + (err && err.message ? err.message : 'error desconocido'));
} finally {
clearTimeout(safetyTimeout);
state.tareaShareLoading = false;
render();
}
}

function defaultSumativaConfig() {

}
function sumativaConfigArr(nivel) {

}
function formatearFechaCorta(iso) {
if (!iso) return '';
const [y, m, d] = iso.split('-');
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
return `${Number(d)} ${MESES[Number(m) - 1] || ''} ${y}`;
}
function defaultSumativaPeriodos() {
const hoy = new Date();
const anioInicio = (hoy.getMonth() + 1) >= 8 ? hoy.getFullYear() : hoy.getFullYear() - 1;
const anioFin = anioInicio + 1;
return {
p1: { inicio: `${anioInicio}-08-01`, fin: `${anioInicio}-11-20` },
p2: { inicio: `${anioInicio}-11-23`, fin: `${anioFin}-03-31` },
p3: { inicio: `${anioFin}-04-01`, fin: `${anioFin}-06-30` }
};
}
function sumativaPeriodos() {
return state.sumativaPeriodos || defaultSumativaPeriodos();
}
function fechaEnPeriodo(fecha, periodoId) {
if (!fecha) return false;
const p = sumativaPeriodos()[periodoId];
if (!p || !p.inicio || !p.fin) return false;
return fecha >= p.inicio && fecha <= p.fin;
}
function seleccionarPeriodoSumativa(periodoId) {
state.sumativaPeriodoActivo = periodoId;
render();
}
function toggleEditarPeriodosSumativa() {
state.sumativaEditandoPeriodos = !state.sumativaEditandoPeriodos;

}
function actualizarFechaPeriodoLocal(periodoId, campo, value) {

periodos[periodoId] = { ...periodos[periodoId], [campo]: value };
state.sumativaPeriodos = periodos;
}
function guardarPeriodosSumativa() {
sumativaPeriodosRef.set(sumativaPeriodos()).then(() => showToast('💾 Fechas de periodos guardadas')).catch(() => showToast('No se pudo guardar'));
}
function sumativaMateriaKey(nivel) {
return nivel === 'primaria' ? (state.sumativaFilterMateria || MATERIAS[0]) : 'general';
}
function calcularPromedioTareas(nivel, studentId, grade, grupo, materia, periodoId) {
const map = nivel === 'primaria' ? state.tareasPri : state.tareasSec;
// Regla de 3: se toman TODAS las tareas asignadas al alumno en este periodo (estén
// calificadas o no). La suma de lo ya calificado se divide entre el total de tareas
// asignadas, así el promedio avanza en vivo conforme se van calificando, en vez de
// esperar a que todas tengan nota para poder mostrar algo.
const asignadas = Object.values(map).filter(t => t.grade === grade && (nivel === 'primaria' ? t.materia === materia : t.grupo === grupo) && fechaEnPeriodo(t.fecha, periodoId) && t.entregas && t.entregas[studentId]);
if (!asignadas.length) return null; // de verdad no hay tareas asignadas todavía
const suma = asignadas.reduce((a, t) => a + (typeof t.entregas[studentId].calificacion === 'number' ? t.entregas[studentId].calificacion : 0), 0);
return suma / asignadas.length;
}
function getSumativaValor(nivel, studentId, componentId, periodoId) {
const map = nivel === 'primaria' ? state.sumativaCalifPri : state.sumativaCalifSec;
const mk = sumativaMateriaKey(nivel);
return (map[studentId] && map[studentId][mk] && map[studentId][mk][periodoId] && map[studentId][mk][periodoId][componentId] != null) ? map[studentId][mk][periodoId][componentId] : null;
}
function setSumativaValorLocal(nivel, studentId, componentId, periodoId, value) {
const map = nivel === 'primaria' ? state.sumativaCalifPri : state.sumativaCalifSec;
const mk = sumativaMateriaKey(nivel);
if (!map[studentId]) map[studentId] = {};
if (!map[studentId][mk]) map[studentId][mk] = {};
if (!map[studentId][mk][periodoId]) map[studentId][mk][periodoId] = {};
map[studentId][mk][periodoId][componentId] = value === '' ? null : Number(value);
}
function guardarSumativaGrupo(nivel) {

}
function diasHabilesEnPeriodo(nivel, periodoId) {
const roster = nivel === 'primaria' ? state.students : state.secStudents;
const ids = new Set(roster.map(s => s.id));
const fechas = new Set();
(state.checkinAttendance || []).forEach(a => {
if (a.studentId && ids.has(a.studentId) && fechaEnPeriodo(a.date, periodoId)) fechas.add(a.date);
});
return fechas.size;
}
function diasAsistidosEstudiante(studentId, periodoId) {
const fechas = new Set();
(state.checkinAttendance || []).forEach(a => {
if (a.studentId === studentId && fechaEnPeriodo(a.date, periodoId)) fechas.add(a.date);
});
return fechas.size;
}
function calcularAsistenciaSumativa(nivel, studentId, periodoId) {
const habiles = diasHabilesEnPeriodo(nivel, periodoId);
if (!habiles) return null;
const asistidos = diasAsistidosEstudiante(studentId, periodoId);
const pct = Math.min(1, asistidos / habiles);
return Math.round(pct * 10 * 10) / 10;
}
function calcularFinalSumativa(nivel, s, periodoId, materiaOverride) {
const config = sumativaConfigArr(nivel);
const mk = materiaOverride || sumativaMateriaKey(nivel);

const faltan = [];

config.forEach(c => {

if (c.id === 'tareas') {
valor = tareasValor;

// Se calculan solos a partir de los días que el alumno escaneó su QR

valor = calcularAsistenciaSumativa(nivel, s.id, periodoId);
} else if (c.id === 'examen') {
// Si no se captura una calificación de examen, se calcula en automático
// de forma proporcional a lo que el alumno lleva en Tareas.
const manual = getSumativaValor(nivel, s.id, c.id, periodoId);
valor = manual != null ? manual : tareasValor;
} else {
valor = c.automatico ? tareasValor : getSumativaValor(nivel, s.id, c.id, periodoId);
}
if (valor == null) faltan.push(c.nombre);
total += (valor || 0) * ((Number(c.porcentaje) || 0) / 100);
});
return { total, faltan, completo: faltan.length === 0 };
}

// ---------------- Init ----------------
// ---------------- Mayúsculas automáticas en toda la app ----------------
// Aplica a inputs de texto sin tipo especial y a textareas (no afecta
// email, password, date, number, etc.), incluso en campos creados
// dinámicamente vía innerHTML.
document.addEventListener('input', function (e) {
var el = e.target;
if (!el || typeof el.matches !== 'function') return;
if (!el.matches('input[type="text"], input:not([type]), textarea')) return;
var start = el.selectionStart, end = el.selectionEnd;
var upper = el.value.toUpperCase();
if (upper !== el.value) {
el.value = upper;
if (start !== null && typeof el.setSelectionRange === 'function') {
try { el.setSelectionRange(start, end); } catch (err) {}
}
}
});
